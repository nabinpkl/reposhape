# Publishing to PyPI (ADR-0012).
#
# A version tag (`v0.1.0`) publishes to PyPI through trusted publishing, so no
# token exists anywhere, and with PEP 740 attestations, so each file on PyPI
# names this repository, this workflow and the commit that built it. A manual
# run is a dry run: it builds and smoke-tests the distributions and uploads
# nothing.
#
# Build and publish are separate jobs: the build runs the project's own code
# and its dependencies' build steps, and only the publish job, which runs
# nothing but the upload, may request an identity token. That job names the
# GitHub environment `pypi`, which the trusted publisher registered on PyPI
# must match, and which only accepts deployments from `v*` tags.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache in a job whose output is published: a poisoned cache entry
          # would end up inside the wheel.
          package-manager-cache: false

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.15.1 --activate

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody tagged. PyPI never accepts the same version twice, so the
      # mistake could not be undone by re-uploading.
      - name: Tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match backend/pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Gate
        run: just check

      - name: Build and drive the packages
        run: just package-smoke

      - name: Keep the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reposhape/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
