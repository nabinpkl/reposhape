# The gate, on every push to main and every pull request: `just check`, then
# the built packages installed and driven on Linux (`just package-smoke`).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The version SPEC's stack table and the Dockerfile pin. No root
      # package.json carries a packageManager field for corepack to read.
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.15.1 --activate

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"

      - name: Gate
        run: just check

      - name: Build and drive the packages
        run: just package-smoke
